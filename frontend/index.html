<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEA/MPEA AI Materials Discovery</title>
</head>
<body>

    <h1>AI-Assisted HEA/MPEA Materials Discovery</h1>
    <p>Machine Learning • Materials Informatics • XAI • Uncertainty • Optimization</p>

    <h2>Yield Strength Prediction</h2>

    <div id="composition"></div>

    <h3>Experimental Conditions</h3>

    <label>Test Temperature (°C)</label>
    <input id="temperature" type="number" value="25">

    <br><br>

    <label>Phase</label>
    <select id="phase">
        <option>FCC</option>
        <option>BCC</option>
        <option>HCP</option>
        <option>FCC+BCC</option>
        <option>FCC+HCP</option>
        <option>BCC+HCP</option>
        <option>Multiphase</option>
    </select>

    <br><br>

    <label>Test Type</label>
    <select id="testType">
        <option>T</option>
        <option>C</option>
    </select>

    <br><br>

    <button onclick="predictYS()">Predict Yield Strength</button>

    <h2 id="result"></h2>

    <script src="script.js"></script>

</body>
</html>
